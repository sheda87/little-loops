<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e5240">
  <meta name="description" content="Little Loops: a cozy crochet companion with stitch counters, how-to guides, a project library and a yarn stash.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Little Loops">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>Little Loops</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="22" r="14" fill="#c23b4a"/>
        <path d="M8 18c8 3 16 3 24 0M7 25c9 3 17 3 26 0M13 10c4 8 4 16 0 24M24 9c-4 8-4 17 0 25" fill="none" stroke="#fbf6ea" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
        <path d="M20 8c-1-4 2-6 6-6-1 4-3 6-6 6z" fill="#a9c1a5"/>
        <path d="M20 8c1-3-1-5-5-5 0 3 2 5 5 5z" fill="#7fa585"/>
      </svg>
      <h1>Little Loops</h1>
    </div>
    <button class="icon-btn light" data-act="settings" aria-label="Settings and backup">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div class="scallop" aria-hidden="true"></div>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Main">
    <button data-tab="count" aria-label="Count">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5v9M7.5 12h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Count</span>
    </button>
    <button data-tab="learn" aria-label="Learn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5c3-1.3 6-1.1 8 .8 2-1.9 5-2.1 8-.8V19c-3-1.3-6-1.1-8 .8-2-1.9-5-2.1-8-.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 6.3V19.8" stroke="currentColor" stroke-width="2"/></svg>
      <span>Learn</span>
    </button>
    <button data-tab="projects" aria-label="Projects">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5c-5-3-8-6.2-8-9.7C4 8.2 5.8 6.5 8 6.5c1.7 0 3 .9 4 2.2 1-1.3 2.3-2.2 4-2.2 2.2 0 4 1.7 4 4.3 0 3.5-3 6.7-8 9.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 6.5c-.3-1.6.6-3 2.4-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <span>Projects</span>
    </button>
    <button data-tab="yarn" aria-label="Yarn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 9.5c4 2 8 2 14 0M3.5 14c5 2.5 9 2.5 15 0M8 4.5c2 4.500 2 10 0 15M14 4.5c-2 4.500-2 10 0 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M18.500 17c1.500 1.500 2.500 2.500 4 2.500" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <span>Yarn</span>
    </button>
  </nav>

  <div id="page" class="page" hidden></div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <input type="file" id="restore-input" accept=".json,application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
